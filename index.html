<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Watch — Live Openings</title>
<!--
  LIVE frontend. Reads the Supabase `jobs` table directly and always shows the
  latest pull. Host it on Vercel / Netlify / GitHub Pages (a normal web host —
  unlike a Claude artifact, these have no CSP restriction on fetch).
  → Fill in the two config values just below, then deploy.
-->
<script>
  const SUPABASE_URL = "https://lspdfpveonvxwjxrdrpf.supabase.co";   // project URL
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzcGRmcHZlb252eHdqeHJkcnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjI1ODEsImV4cCI6MjEwNDk5ODU4MX0.84R9eFuvO7_CeQFWAJlPQGL6KSSJvm4MLQShdeI9bGc";  // anon (public) key — read-only
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#f4f1ea;--panel:#fbfaf6;--panel2:#f0ece2;--ink:#1c1e22;--soft:#54565c;
    --line:#ddd6c8;--accent:#155e52;--accentS:#e3efe9;--hot:#b4471f;--hotS:#f6e6dc;--li:#1a5b8a}
  @media(prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1c1f25;--panel2:#23272e;
    --ink:#eceae3;--soft:#a2a4ab;--line:#2c313a;--accent:#5bc4ae;--accentS:#17352f;--hot:#e8875a;--hotS:#3a271c;--li:#66b2e0}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:var(--panel);padding:26px 0}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:0}
  .sub{color:var(--soft);margin:8px 0 0;font-size:15px}
  .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
  .bar-in{max-width:960px;margin:0 auto;padding:0 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--soft);
    padding:6px 13px;border-radius:6px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}
  input{flex:1;min-width:160px;font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  main{padding:20px 0 60px}
  .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--soft);margin:4px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);
    border-radius:11px;padding:13px 14px;background:var(--panel);transition:.13s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .of{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between}
  .new{color:var(--hot);background:var(--hotS);border-radius:5px;padding:1px 6px}
  .role{font-weight:600;font-size:14.5px;line-height:1.25}
  .loc{font-size:12.5px;color:var(--soft);margin-top:5px}
  .empty{padding:50px 0;text-align:center;color:var(--soft)}
  footer{border-top:1px solid var(--line);color:var(--soft);font-size:13px;padding:20px 0 40px}
</style>
</head>
<body>
<header><div class="wrap">
  <p class="eyebrow">Analyst &amp; Associate · Live from Supabase</p>
  <h1>Street Watch</h1>
  <p class="sub">Real openings, pulled every morning from firms' hiring systems. Click a role to apply.</p>
</div></header>

<div class="bar"><div class="bar-in">
  <div class="seg" id="metros">
    <button data-m="all" aria-pressed="true">All</button>
    <button data-m="NY + Jersey City">NY + JC</button>
    <button data-m="SF / Bay Area">SF / Bay</button>
    <button data-m="Chicago">Chicago</button>
  </div>
  <div class="seg" id="recency" title="Filtered by the date the firm posted the role">
    <button data-d="all" aria-pressed="true">Any time</button>
    <button data-d="1">24h</button>
    <button data-d="7">7d</button>
    <button data-d="30">30d</button>
  </div>
  <input id="q" type="search" placeholder="Filter by firm or role…" autocomplete="off">
</div></div>

<main class="wrap">
  <div class="meta" id="meta">Loading…</div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">
  Data refreshes daily via the pipeline. Not all target firms are automated yet — see the dashboard for the manual-browse list.
</div></footer>

<script>
let JOBS = [], metro = "all", q = "", recency = "all";
const grid = document.getElementById("grid"), meta = document.getElementById("meta");

// days since a YYYY-MM-DD posted_date (UTC, day granularity); null if no date
function daysSince(d){
  if(!d) return null;
  const t = Date.parse(d + "T00:00:00Z");
  if(isNaN(t)) return null;
  return (Date.now() - t) / 86400000;
}
function postedLabel(d){
  const n = daysSince(d);
  if(n === null) return "";
  if(n < 1) return "today";
  const days = Math.floor(n);
  return days === 1 ? "1d ago" : days < 30 ? `${days}d ago`
       : days < 60 ? "1mo ago" : `${Math.floor(days/30)}mo ago`;
}

async function load(){
  if(SUPABASE_URL.includes("YOUR-PROJECT")){
    meta.textContent = "Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file, then deploy.";
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs?select=*&order=metro.asc,firm.asc,title.asc`,
      {headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
    JOBS = await res.json();
    render();
  }catch(e){ meta.textContent = "Could not load jobs: " + e.message; }
}
function render(){
  const needle = q.trim().toLowerCase();
  const win = recency === "all" ? Infinity : Number(recency);
  let base = JOBS.filter(j =>
    (metro==="all" || j.metro===metro) &&
    (!needle || (j.firm+" "+j.title).toLowerCase().includes(needle)));
  // recency filter uses the firm's posted_date; rows without one have unknown
  // recency and are shown only under "Any time".
  let undated = 0;
  let list = base.filter(j => {
    if(win === Infinity) return true;
    const n = daysSince(j.posted_date);
    if(n === null){ undated++; return false; }
    return n <= win;
  });
  const nnew = list.filter(j=>j.is_new).length;
  const hidden = win === Infinity ? 0 : undated;
  meta.textContent = `${list.length} roles`
    + (nnew ? ` · ${nnew} new today` : "")
    + (win !== Infinity ? ` · posted ≤ ${win===1?"24h":win+"d"}` : "")
    + (hidden ? ` · ${hidden} hidden (no posted date)` : "");
  grid.innerHTML = list.length ? list.map(j=>{
    const age = postedLabel(j.posted_date);
    return `
    <a class="card" target="_blank" rel="noopener" href="${j.url}">
      <div class="of"><span>${j.firm}</span>${j.is_new?'<span class="new">NEW</span>':''}</div>
      <div class="role">${j.title}</div>
      <div class="loc">${j.location||j.metro} · ${j.source}${age?` · ${age}`:""}</div>
    </a>`;}).join("") : `<div class="empty">No roles match. Clear the filter.</div>`;
}
document.getElementById("metros").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  metro = b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});
document.getElementById("recency").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  recency = b.dataset.d;
  [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});
document.getElementById("q").addEventListener("input", e=>{ q = e.target.value; render(); });
load();
</script>
</body>
</html>
