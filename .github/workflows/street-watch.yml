name: Street Watch — daily job pull

# Target: newsletter delivered BY 9am Eastern every day.
# GitHub's scheduled queue is best-effort: in practice our 10:20 UTC cron has
# started 4-5 HOURS late (~15:00 UTC = 11am ET) and some days never fires at all.
# So the primary trigger is EXTERNAL — cron-job.org calls workflow_dispatch at
# 10:20 UTC (see README -> "Reliable daily trigger"). The crons below are only
# backups in case that external call fails. pipeline.py mails at most once per
# UTC day, so extra runs just refresh the data without a duplicate email.
on:
  schedule:
    - cron: "20 10 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch: {}          # external trigger + manual button in the Actions tab

# Never run two pulls at once: the second would start from stale state and its
# push would be rejected. Queue it instead.
concurrency:
  group: street-watch-pull
  cancel-in-progress: false

permissions:
  contents: write                # so the run can commit the state file back

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # latest main at run time, not the (possibly hours-old) trigger SHA

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests cloudscraper   # cloudscraper: Citadel (Cloudflare) fetcher

      - name: Run pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Morning newsletter (optional, SMTP). If these are unset, pipeline.py
          # skips the email cleanly. See README → Newsletter.
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_TO:        ${{ secrets.NEWSLETTER_TO }}
          DASHBOARD_URL:        ${{ secrets.DASHBOARD_URL }}
          NEWSLETTER_SEND_EMPTY: "1"   # still send the morning greeting on zero-new days
        run: python pipeline.py

      - name: Persist state + outputs
        run: |
          git config user.name  "street-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .street_watch_state.json street_watch_jobs.json street_watch_jobs.csv || true
          git commit -m "chore: daily job pull $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
