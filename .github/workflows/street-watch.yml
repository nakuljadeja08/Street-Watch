name: Street Watch — daily job pull

# Target: newsletter delivered BY 9am Eastern every day.
# GitHub's scheduled queue is best-effort and delays top-of-hour (:00) crons by
# hours, so we start early (10:20 UTC = ~6:20am EDT / 5:20am EST) and off :00.
# Even with GitHub delay + ~20min runtime this completes well before 9am ET
# (13:00 UTC in summer / 14:00 UTC in winter). NOTE: GitHub can't guarantee exact
# scheduled timing — for a hard guarantee use an external trigger (see README).
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch: {}          # lets you trigger it manually from the Actions tab

permissions:
  contents: write                # so the run can commit the state file back

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests cloudscraper   # cloudscraper: Citadel (Cloudflare) fetcher

      - name: Run pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Morning newsletter (optional, SMTP). If these are unset, pipeline.py
          # skips the email cleanly. See README → Newsletter.
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_TO:        ${{ secrets.NEWSLETTER_TO }}
          DASHBOARD_URL:        ${{ secrets.DASHBOARD_URL }}
          NEWSLETTER_SEND_EMPTY: "1"   # still send the morning greeting on zero-new days
        run: python pipeline.py

      - name: Persist state + outputs
        run: |
          git config user.name  "street-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .street_watch_state.json street_watch_jobs.json street_watch_jobs.csv || true
          git commit -m "chore: daily job pull $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"
