name: Street Watch — test newsletter

# Manual button in the Actions tab. Sends a one-off digest from the last
# committed job pull using the SMTP secrets — no scrape, no data changes.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Send test newsletter
        env:
          # NB: the host/password secrets are spelled SMPT_* in the repo settings
          # (typo kept because a secret can't be renamed without re-entering its
          # value); we map them to the correctly-spelled env vars the code reads.
          SMTP_HOST:            ${{ secrets.SMPT_HOST }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMPT_PASSWORD }}
          NEWSLETTER_TO:        ${{ secrets.NEWSLETTER_TO }}
          DASHBOARD_URL:        ${{ secrets.DASHBOARD_URL }}
        run: python send_test_newsletter.py
